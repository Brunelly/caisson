# Deploy Caisson.Api to the Azure Container Apps TEST environment.
#
# TEST-only, single environment. The app runs with ASPNETCORE_ENVIRONMENT=Testing so the
# environment-gated test-auth scheme (fixed, read-only synthetic principal — ADR 0018) is active and
# Swagger is served: the API is browsable/queryable without a real Entra tenant. This is deliberately
# NOT how a production deployment would run (production uses real Entra OIDC — a separate story).
#
# Auth to Azure is OIDC workload-identity federation (no stored Azure secret). The only secret is
# CAISSON_DB (the Postgres connection string). See docs/deploy-test.md.
name: Deploy (Test)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  RG: by-rg-caisson-dev
  APP_API: by-azuks-app-caisson-api
  APP_WEB: by-azuks-app-caisson-web
  PG_SERVER: by-azuks-psql-caisson-dev
  IMAGE: ghcr.io/brunelly/caisson-api
  IMAGE_WEB: ghcr.io/brunelly/caisson-web
  WEB_FQDN: by-azuks-app-caisson-web.lemontree-7bffb5af.uksouth.azurecontainerapps.io

jobs:
  build-push-api:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Caisson.Api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest

  migrate-seed:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Open the Postgres firewall to this runner
        run: |
          ip=$(curl -s https://api.ipify.org)
          echo "runner ip: $ip"
          az postgres flexible-server firewall-rule create \
            -g "$RG" -s "$PG_SERVER" -n "gha-${GITHUB_RUN_ID}" \
            --start-ip-address "$ip" --end-ip-address "$ip"
      - name: Apply EF Core migrations
        env:
          CAISSON_DB: ${{ secrets.CAISSON_DB }}
        run: |
          # The repo pins dotnet-ef via a local tool manifest (.config/dotnet-tools.json), so restore it
          # and invoke through the manifest — matches the CI migration-apply/rollback gate exactly.
          dotnet tool restore
          dotnet tool run dotnet-ef -- database update \
            --project src/Caisson.Infrastructure --startup-project src/Caisson.Infrastructure
      - name: Seed a virtual rack (demo data)
        # Best-effort: the initial deploy seeds the demo rack; a later re-seed is a nice-to-have and must
        # not fail the deploy (a fresh rack each run is only cosmetic, and the seeder's discovery pass can
        # transiently report RACK_DEFINITION_MISSING). Migration above stays blocking.
        continue-on-error: true
        env:
          CAISSON_DB: ${{ secrets.CAISSON_DB }}
        run: dotnet run --project tests/Caisson.VirtualRack.Seeder -c Release
      - name: Close the Postgres firewall to this runner
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete \
            -g "$RG" -s "$PG_SERVER" -n "gha-${GITHUB_RUN_ID}" --yes || true

  deploy-api:
    needs: [build-push-api, migrate-seed]
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Set the DB secret on the app
        # The ghcr images are PUBLIC, so the container app pulls them anonymously — no registry
        # credential is configured (an ephemeral GITHUB_TOKEN cred would expire and break later pulls).
        run: |
          az containerapp secret set -g "$RG" -n "$APP_API" \
            --secrets "caisson-db=${{ secrets.CAISSON_DB }}"
      # Story #172: the Container App's SYSTEM-ASSIGNED managed identity is granted least-scope
      # "Key Vault Secrets User" on the configured vault, so Caisson.Api can read the GitHub PAT at runtime
      # via DefaultAzureCredential. The PAT is NEVER copied into an Actions secret or a Container App secret
      # — only the non-secret vault URI + secret NAME are passed as env vars below. Opt-in via the
      # CAISSON_KEYVAULT_NAME repository variable so the existing TEST deploy is unaffected until configured.
      - name: Grant the app's managed identity Key Vault Secrets User
        if: ${{ vars.CAISSON_KEYVAULT_NAME != '' }}
        run: |
          principal=$(az containerapp identity assign -g "$RG" -n "$APP_API" --system-assigned \
            --query principalId -o tsv)
          scope=$(az keyvault show -n "${{ vars.CAISSON_KEYVAULT_NAME }}" --query id -o tsv)
          az role assignment create --assignee-object-id "$principal" \
            --assignee-principal-type ServicePrincipal \
            --role "Key Vault Secrets User" --scope "$scope"
      - name: Deploy image + runtime config
        # Git PR (story #172) runtime config is all NON-SECRET: the feature flag, repo owner/name/default
        # branch, and — when a vault is configured — the vault URI and the PAT secret NAME (never its value).
        run: |
          set -euo pipefail
          env_vars=(
            ASPNETCORE_ENVIRONMENT=Testing
            Testing__EnableTestAuth=true
            ASPNETCORE_URLS=http://+:8080
            CAISSON_DB=secretref:caisson-db
          )
          if [ "${{ vars.GIT_PR_ENABLED }}" = "true" ]; then
            env_vars+=(
              Git__GitHub__Enabled=true
              Git__GitHub__RepoOwner="${{ vars.GIT_PR_REPO_OWNER }}"
              Git__GitHub__RepoName="${{ vars.GIT_PR_REPO_NAME }}"
              Git__GitHub__DefaultBranch="${{ vars.GIT_PR_DEFAULT_BRANCH }}"
              Git__GitHub__AuthMode=Pat
              Git__GitHub__KeyVaultUri="${{ vars.CAISSON_KEYVAULT_URI }}"
              Git__GitHub__PatSecretName="${{ vars.GIT_PR_PAT_SECRET_NAME }}"
            )
          fi
          az containerapp update -g "$RG" -n "$APP_API" \
            --image "${IMAGE}:${{ needs.build-push-api.outputs.tag }}" \
            --set-env-vars "${env_vars[@]}"
          az containerapp ingress update -g "$RG" -n "$APP_API" --target-port 8080
      - name: Health check the public endpoint
        run: |
          fqdn=$(az containerapp show -g "$RG" -n "$APP_API" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "API: https://$fqdn"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$fqdn/health/ready" || true)
            echo "attempt $i: /health/ready -> $code"
            if [ "$code" = "200" ]; then
              echo "::notice::Caisson.Api is live and healthy at https://$fqdn (Swagger: /swagger)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::/health/ready never returned 200"; exit 1

  build-push-web:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          # TEST-only demo build: auth-bypass SPA pointed at the deployed API (see environment.azuredemo.ts).
          build-args: |
            NG_CONFIG=azuredemo
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_WEB }}:latest

  deploy-web:
    needs: [build-push-web, deploy-api]
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Allow the SPA origin through the API's CORS
        run: |
          az containerapp update -g "$RG" -n "$APP_API" \
            --set-env-vars "Cors__AllowedOrigins__0=https://${WEB_FQDN}"
      - name: Deploy the demo image (public ghcr → anonymous pull, no registry cred)
        run: |
          az containerapp update -g "$RG" -n "$APP_WEB" \
            --image "${IMAGE_WEB}:${{ needs.build-push-web.outputs.tag }}"
          az containerapp ingress update -g "$RG" -n "$APP_WEB" --target-port 8080
      - name: Health check the SPA
        run: |
          fqdn=$(az containerapp show -g "$RG" -n "$APP_WEB" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Web: https://$fqdn"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$fqdn/" || true)
            echo "attempt $i: / -> $code"
            if [ "$code" = "200" ]; then
              echo "::notice::Caisson SPA (demo) is live at https://$fqdn"
              exit 0
            fi
            sleep 10
          done
          echo "::error::SPA / never returned 200"; exit 1
