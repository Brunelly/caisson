name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Ephemeral PostgreSQL for the migration gate and integration tests (NFR3).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caisson
          POSTGRES_PASSWORD: caisson
          POSTGRES_DB: caisson
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caisson"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Design-time factory (dotnet ef) and integration-test fixture both read these.
      CAISSON_DB: "Host=localhost;Port=5432;Database=caisson;Username=caisson;Password=caisson"
      CAISSON_TEST_DB: "Host=localhost;Port=5432;Database=caisson;Username=caisson;Password=caisson"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore local tools (dotnet-ef)
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (warnings as errors)
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Verify formatting
        run: dotnet format --verify-no-changes

      - name: Domain unit tests
        run: dotnet test tests/Caisson.Domain.Tests --no-build -c Release

      - name: Driver abstraction unit tests
        run: dotnet test tests/Caisson.Drivers.Abstractions.Tests --no-build -c Release

      - name: MikroTik driver unit tests
        run: dotnet test tests/Caisson.Drivers.MikroTik.Tests --no-build -c Release

      # In-process RouterOS API simulator — no service container needed, deterministic and hardware-free.
      # Set CAISSON_CHR_HOST to point the same suite at a real CHR instead.
      - name: MikroTik driver integration tests (simulator)
        run: dotnet test tests/Caisson.Drivers.MikroTik.IntegrationTests --no-build -c Release --logger "trx;LogFileName=mikrotik-integration.trx"

      - name: Upload MikroTik test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mikrotik-test-logs
          path: tests/Caisson.Drivers.MikroTik.IntegrationTests/TestResults/*.trx
          if-no-files-found: ignore

      - name: Redfish driver unit tests
        run: dotnet test tests/Caisson.Drivers.Redfish.Tests --no-build -c Release

      # In-process HTTPS Redfish simulator + stubbed ipmitool fixtures — no service container, deterministic
      # and hardware-free. Set CAISSON_ILO_HOST / CAISSON_IPMI_HOST to point the same suite at real hardware.
      - name: Redfish driver integration tests (simulator)
        run: dotnet test tests/Caisson.Drivers.Redfish.IntegrationTests --no-build -c Release --logger "trx;LogFileName=redfish-integration.trx"

      - name: Upload Redfish test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: redfish-test-logs
          path: tests/Caisson.Drivers.Redfish.IntegrationTests/TestResults/*.trx
          if-no-files-found: ignore

      # Explicit migration apply + rollback gate against the service container,
      # independent of the Testcontainers-based fixture.
      - name: Migration apply/rollback gate
        run: |
          dotnet ef database update   --project src/Caisson.Infrastructure --startup-project src/Caisson.Infrastructure
          dotnet ef database update 0 --project src/Caisson.Infrastructure --startup-project src/Caisson.Infrastructure

      # Rides the DB-free mapping/diff/shaping/stable-key/cursor unit suites (which run with no database)
      # alongside the Postgres-backed persistence, immutability and constraint tests.
      - name: Infrastructure integration tests
        run: dotnet test tests/Caisson.Infrastructure.Tests --no-build -c Release

      # Control-plane API: RBAC matrix, correlation-id, pagination/problem-details, query round-trips and
      # the read-only guard, hosted in-process via WebApplicationFactory against the Postgres service.
      - name: API integration tests
        run: dotnet test tests/Caisson.Api.IntegrationTests --no-build -c Release

      # Story #11: the consolidated virtual-rack harness — drives the REAL RouterOsSwitchDriver/
      # RedfishBmcDriver against the in-process simulators through the real orchestration/persistence/
      # query path (no fake drivers), and asserts the discovered-vs-expected topology diff.
      - name: Virtual-rack integration tests (simulators)
        run: dotnet test tests/Caisson.VirtualRack.IntegrationTests --no-build -c Release --logger "trx;LogFileName=virtual-rack.trx"

      - name: Upload virtual-rack test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-rack-test-logs
          path: tests/Caisson.VirtualRack.IntegrationTests/TestResults/*.trx
          if-no-files-found: ignore

  angular-build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      # Angular 22's default unit-test builder (Vitest + jsdom) runs headless with no Chrome
      # install needed; --watch=false is explicit here even though it is already the CI default
      # (ng test defaults --watch to false outside a TTY) — see ADR 0015.
      - name: Unit tests
        run: npm test -- --watch=false

      - name: Upload test/coverage artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: angular-test-artifacts
          path: |
            web/coverage
          if-no-files-found: ignore

  # Story #11: a SELF-CONTAINED Playwright smoke test (Task #55) — this job now provisions its own
  # Postgres, seeds a virtual rack via the repo-native Caisson.VirtualRack.Seeder (real drivers + real
  # orchestration against the in-process simulators, no mcp-tooling-caisson reference), boots a live
  # Caisson.Api with its environment-gated test-auth scheme (ADR 0018), and serves the `e2e`-configured
  # Angular build (ADR 0016-style fileReplacements auth bypass). It no longer depends on an externally
  # seeded stack, so it is a genuine required check once enabled.
  #
  # ACTION ITEM (outside source control): flip the `E2E_ENABLED` repository variable to `true` in repo
  # Settings → Secrets and variables → Actions → Variables to turn this job on as a required check —
  # see docs/simulation-harness.md.
  angular-e2e-smoke:
    runs-on: ubuntu-latest
    if: ${{ vars.E2E_ENABLED == 'true' }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caisson
          POSTGRES_PASSWORD: caisson
          POSTGRES_DB: caisson
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caisson"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CAISSON_DB: "Host=localhost;Port=5432;Database=caisson;Username=caisson;Password=caisson"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Restore local tools (dotnet-ef)
        run: dotnet tool restore

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build .NET (Release)
        run: dotnet build --no-restore -c Release

      - name: Apply database migrations
        run: dotnet ef database update --project src/Caisson.Infrastructure --startup-project src/Caisson.Infrastructure

      # Boots the simulators + real drivers + real orchestration against CAISSON_DB, drives a discovery
      # job to Succeeded, and prints E2E_RACK_ID/E2E_SEARCH_TERM/E2E_SEARCH_LABEL_PART. The live API
      # below only ever reads this already-persisted snapshot — it never reaches the simulators.
      - name: Seed the virtual rack
        run: dotnet run --no-build --project tests/Caisson.VirtualRack.Seeder -c Release | tee "$RUNNER_TEMP/seed-output.txt"

      - name: Export seeded rack identifiers
        run: grep -E '^E2E_(RACK_ID|SEARCH_TERM|SEARCH_LABEL_PART)=' "$RUNNER_TEMP/seed-output.txt" >> "$GITHUB_ENV"

      # The environment-gated test-auth scheme (ADR 0018) is enabled ONLY here, via env vars — never in
      # a committed appsettings file — and only under ASPNETCORE_ENVIRONMENT=Testing, which
      # TestAuthStartupGuard requires.
      - name: Start Caisson.Api with the test-auth scheme
        env:
          ASPNETCORE_ENVIRONMENT: "Testing"
          Testing__EnableTestAuth: "true"
          ASPNETCORE_URLS: "http://127.0.0.1:5000"
          Cors__AllowedOrigins__0: "http://127.0.0.1:4200"
        run: |
          nohup dotnet run --no-build --project src/Caisson.Api -c Release > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/health/ready > /dev/null; then
              echo "Caisson.Api is ready."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Caisson.Api did not become ready within 30s"
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Install npm dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      # Finding #7: the real-backend smoke spec (topology.smoke.spec.ts) and the fixture-only,
      # auth-bypassing dev-harness spec (topology-harness.spec.ts, ADR 0016) now build and serve from
      # TWO SEPARATE Angular configurations instead of one shared build. The `e2e` configuration is
      # hardened to swap in the same production route table (app.routes.prod.ts) a real deploy would
      # ship — the smoke spec never visits `/__dev-harness__/...` — so the only build ever served
      # alongside the real, seeded Caisson.Api backend below has no unauthenticated harness route or
      # fixture/fake-hub code reachable at all. The `harness` configuration (route + fixtures/fake-hub
      # kept, same OIDC-bypass auth config) serves the harness spec on its own, backend-free run.
      - name: Build Angular (e2e configuration, auth bypass, production route table)
        working-directory: web
        run: npm run build:e2e

      - name: Serve the Angular e2e build
        working-directory: web
        run: |
          nohup npm run serve:e2e > "$RUNNER_TEMP/serve-e2e.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/serve-e2e.pid"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4200/ > /dev/null; then
              echo "Angular e2e build is being served."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Angular e2e build did not become ready within 30s"
          cat "$RUNNER_TEMP/serve-e2e.log"
          exit 1

      - name: Run e2e smoke test
        working-directory: web
        env:
          E2E_BASE_URL: "http://127.0.0.1:4200"
        run: npx playwright test topology.smoke.spec.ts

      - name: Stop the Angular e2e build server
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/serve-e2e.pid" ] && kill "$(cat "$RUNNER_TEMP/serve-e2e.pid")" 2>/dev/null || true

      - name: Build Angular (harness configuration, auth bypass, dev-harness route)
        working-directory: web
        run: npm run build:harness

      - name: Serve the Angular harness build
        working-directory: web
        run: |
          nohup npm run serve:harness > "$RUNNER_TEMP/serve-harness.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/serve-harness.pid"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4200/ > /dev/null; then
              echo "Angular harness build is being served."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Angular harness build did not become ready within 30s"
          cat "$RUNNER_TEMP/serve-harness.log"
          exit 1

      - name: Run dev-harness e2e test
        working-directory: web
        env:
          E2E_BASE_URL: "http://127.0.0.1:4200"
        run: npx playwright test topology-harness.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

      # Best-effort cleanup; the runner is torn down after the job regardless.
      - name: Stop background processes
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/api.pid" ] && kill "$(cat "$RUNNER_TEMP/api.pid")" 2>/dev/null || true
          [ -f "$RUNNER_TEMP/serve-e2e.pid" ] && kill "$(cat "$RUNNER_TEMP/serve-e2e.pid")" 2>/dev/null || true
          [ -f "$RUNNER_TEMP/serve-harness.pid" ] && kill "$(cat "$RUNNER_TEMP/serve-harness.pid")" 2>/dev/null || true
