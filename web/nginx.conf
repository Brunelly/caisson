# Reference production hosting for the Caisson SPA (security-review-5 #19): serves the built Angular
# app with a strict Content-Security-Policy and standard security headers, so the SPA origin is never
# left header-less. Caisson.Api is assumed same-origin; if it is served from a DIFFERENT origin, add
# that origin to connect-src below.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Strict CSP (matches security-review-5 finding #19) + supporting security headers. 'unsafe-inline'
  # is required only for Angular component styles; scripts remain 'self'-only.
  # connect-src also allows the deployed Caisson.Api container app (XHR + SignalR wss) for the TEST
  # cross-origin demo build; harmless for a same-origin production deployment (which would drop it).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://login.microsoftonline.com https://by-azuks-app-caisson-api.lemontree-7bffb5af.uksouth.azurecontainerapps.io wss://by-azuks-app-caisson-api.lemontree-7bffb5af.uksouth.azurecontainerapps.io; frame-src https://login.microsoftonline.com; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Angular client-side routing: unknown paths fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache content-hashed assets.
  location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
